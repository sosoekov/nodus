services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodus}
      POSTGRES_DB: ${POSTGRES_DB:-nodus}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nodus} -d ${POSTGRES_DB:-nodus}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nodus}:${POSTGRES_PASSWORD:-nodus}@db:5432/${POSTGRES_DB:-nodus}
      SESSION_SECRET: ${SESSION_SECRET:?укажите SESSION_SECRET в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-nodus}
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    command: sh -c "npm run migrate:up && npm run seed && node dist/index.js"

volumes:
  db-data:
